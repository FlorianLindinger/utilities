# Ruff lint and format check on every push and pull request.
# Copy to .github/workflows/. Uses the project's ruff.toml or [tool.ruff] in pyproject.toml.
name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Ruff lint
        run: uvx ruff check --output-format=github .
      - name: Ruff format
        run: uvx ruff format --check --diff .
